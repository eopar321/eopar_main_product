# Runs on every push and pull request. Brief §12 pipeline; later phases add image builds,
# Playwright + axe, Lighthouse and deploy. Third-party actions are pinned to commit SHAs (brief §9A A08).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: eopar
          POSTGRES_PASSWORD: eopar_ci_only
          POSTGRES_DB: eopar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eopar -d eopar" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eopar:eopar_ci_only@localhost:5432/eopar
      PAYLOAD_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database extensions
        run: psql "$DATABASE_URL" -f infra/postgres/init.sql

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck

      - name: Migrations apply cleanly
        run: pnpm --filter @eopar/web migrate
      - name: Payload types are up to date
        run: |
          pnpm --filter @eopar/web generate:types
          git diff --exit-code -- apps/web/src/payload-types.ts

      - name: Tests
        run: pnpm test

      - name: Infrastructure code synthesises
        run: pnpm --filter @eopar/infra synth

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit (pnpm) — fail on high/critical
        run: pnpm audit --audit-level high

      - name: Dependency audit (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

      - name: Config and IaC scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
