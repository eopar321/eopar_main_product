# Weekly dependency update PRs (brief §9A A06).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      next-react:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
