# Local development services. Mirrors production except Postgres, which is RDS in prod.
# Start with: docker compose up -d
name: eopar

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: eopar
      POSTGRES_PASSWORD: eopar_local_only
      POSTGRES_DB: eopar
    # 5433 on the host: a native Windows PostgreSQL already uses 5432 (see DECISIONS D-006)
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eopar -d eopar']
      interval: 5s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', 'redis_local_only']
    # 6380 on the host: 6379 is already taken on the owner's machine (see DECISIONS D-006)
    ports: ['127.0.0.1:6380:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_local_only', 'ping']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web inbox: http://localhost:8025

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    ports: ['127.0.0.1:3310:3310']
    volumes: [clamdb:/var/lib/clamav]

volumes:
  pgdata:
  redisdata:
  clamdb:
